name: Extract project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project files
        run: |
          unzip -o iraqi-sweets-github-ready.zip
          rm -f iraqi-sweets-github-ready.zip
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f .github/workflows/ios-unsigned.yml
          echo "--- ios-unsigned.yml ---"
          cat .github/workflows/ios-unsigned.yml
          echo "--- end ios-unsigned.yml ---"
          rm -f .github/workflows/ios-unsigned.yml
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extract iraqi-sweets project files to repo root" || echo "Nothing to commit"
          git push
